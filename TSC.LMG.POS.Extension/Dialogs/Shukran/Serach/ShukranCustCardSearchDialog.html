<div id="cardSearchRoot" style="padding: 12px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">

        <input id="cardScanInput"
               type="text"
               readonly
               autofocus
               placeholder="Scan card barcode…"
               style="width: 100%; height: 38px; padding: 0 10px; box-sizing: border-box;
                      font-size: 14px; border: 1px solid #c8c8c8; border-radius: 3px;
                      background: #f5f5f5; color: #444; cursor: default;"
               data-bind="value: cardNumber" />

        <div style="padding: 7px 10px; border-radius: 3px;
                    background: #fffbe6; border: 1px solid #ffe58f;
                    font-size: 12px; color: #7c5700; font-weight: 500;">
            ⚠ Please scan the card barcode — manual entry is not allowed.
        </div>

        <div style="color: red; font-size: 11px; min-height: 16px;"
             data-bind="text: validationMessage">
        </div>

    </div>

</div>
